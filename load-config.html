<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Wczytaj konfigurację CEVA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#021D49,#1D4289);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:16px;padding:32px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.icon{font-size:3em;margin-bottom:12px}
.title{font-size:1.3em;font-weight:800;color:#021D49;margin-bottom:6px}
.sub{font-size:.88em;color:#64748b;margin-bottom:20px;line-height:1.5}
.info{background:#f0f4f8;border-radius:10px;padding:14px;margin-bottom:20px;text-align:left}
.row{display:flex;justify-content:space-between;padding:4px 0;font-size:.84em;border-bottom:1px solid #e2e8f0}
.row:last-child{border:none}
.lbl{color:#64748b}.val{font-weight:700;color:#021D49}
.btn{width:100%;padding:14px;border-radius:10px;border:none;font-family:inherit;font-size:1em;font-weight:700;cursor:pointer;transition:all .15s;margin-bottom:10px}
.btn-ok{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 4px 14px rgba(22,163,74,.3)}
.btn-ok:hover{transform:translateY(-1px)}
.btn-cancel{background:#f1f5f9;color:#64748b}
.btn-cancel:hover{background:#e2e8f0}
.status{padding:14px;border-radius:10px;font-size:.9em;font-weight:600;margin-bottom:14px;display:none}
.ok{background:#f0fdf4;color:#166534;border:2px solid #bbf7d0}
.err{background:#fef2f2;color:#dc2626;border:2px solid #fecaca}
.warn{background:#fffbeb;color:#92400e;border:2px solid #fde68a}
.app-links{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.app-btn{display:block;padding:12px;border-radius:10px;text-decoration:none;font-weight:700;font-size:.9em;color:#fff;background:linear-gradient(135deg,#021D49,#1D4289)}
.app-btn:hover{opacity:.9}
.spinner{width:28px;height:28px;border:3px solid rgba(22,163,74,.2);border-top-color:#16a34a;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box" id="box">
  <div id="loading">
    <div class="spinner"></div>
    <div style="color:#64748b;font-size:.9em">Wczytywanie konfiguracji…</div>
  </div>
</div>

<script>
var BASE_URL = 'https://spiffy-mochi-b15b80.netlify.app';
var CACHE_KEY = 'ceva_local_config';

function show(html){ document.getElementById('box').innerHTML = html; }

function saveAndGo(cfg){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify(cfg));
    localStorage.setItem(CACHE_KEY+'_ts', Date.now().toString());
    localStorage.setItem('ceva_location', cfg.location || cfg._meta && cfg._meta.location || '');
  }catch(e){ alert('Błąd zapisu: '+e.message); return; }

  show('<div class="icon">✅</div>'
    +'<div class="title">Config zapisany!</div>'
    +'<div class="sub">Konfiguracja dla <strong>'+esc(cfg.location||'')+'</strong> została zapisana lokalnie na tym urządzeniu.</div>'
    +'<div class="status ok" style="display:block">✅ Dane zapisane w pamięci przeglądarki.<br>Możesz teraz otworzyć aplikację.</div>'
    +'<div class="app-links">'
    +'<a href="'+BASE_URL+'/mobile-index.html" class="app-btn">📱 Otwórz aplikację CEVA</a>'
    +'<a href="'+BASE_URL+'/gemba-audit.html" class="app-btn" style="background:linear-gradient(135deg,#764ba2,#667eea)">👁 GEMBA Walk</a>'
    +'<a href="'+BASE_URL+'/5s-audit-simple.html" class="app-btn" style="background:linear-gradient(135deg,#667eea,#4ecdc4)">📋 Audyt 5S</a>'
    +'</div>'
  );
}

function showConfirm(cfg){
  var loc = cfg.location || (cfg._meta && cfg._meta.location) || '?';
  var ver = cfg._meta && cfg._meta.version ? 'v'+cfg._meta.version : '';
  var savedAt = cfg._meta && cfg._meta.savedAt ? new Date(cfg._meta.savedAt).toLocaleString('pl-PL') : '?';
  var zonesN = (cfg.zones||[]).length;
  var audN   = (cfg.auditors||[]).length;
  var questN = Object.values(cfg.gembaQuestions||{}).reduce(function(s,q){return s+q.length;},0);

  // Sprawdź czy jest już zapisany config
  var existing = null;
  try{ existing = JSON.parse(localStorage.getItem(CACHE_KEY)); }catch(e){}
  var existingNote = existing
    ? '<div class="status warn" style="display:block;margin-bottom:14px">⚠️ Nadpiszesz istniejący config dla <strong>'+(existing.location||'?')+'</strong> ('+( existing._meta&&existing._meta.version?'v'+existing._meta.version:'?')+')</div>'
    : '';

  show('<div class="icon">📥</div>'
    +'<div class="title">Nowy config dla tabletu</div>'
    +'<div class="sub">Chcesz załadować nową konfigurację? Zostanie zapisana lokalnie.</div>'
    + existingNote
    +'<div class="info">'
    +'<div class="row"><span class="lbl">📍 Lokalizacja</span><span class="val">'+esc(loc)+' '+ver+'</span></div>'
    +'<div class="row"><span class="lbl">📍 Strefy</span><span class="val">'+zonesN+'</span></div>'
    +'<div class="row"><span class="lbl">👤 Prowadzący</span><span class="val">'+audN+'</span></div>'
    +'<div class="row"><span class="lbl">❓ Pytania GEMBA</span><span class="val">'+questN+'</span></div>'
    +'<div class="row"><span class="lbl">🕐 Data</span><span class="val">'+savedAt+'</span></div>'
    +'</div>'
    +'<button class="btn btn-ok" onclick="saveAndGo(window._pendingCfg)">✅ Tak, załaduj konfigurację</button>'
    +'<button class="btn btn-cancel" onclick="window.history.back()">✖ Anuluj</button>'
  );
  window._pendingCfg = cfg;
}

function showError(msg){
  show('<div class="icon">❌</div>'
    +'<div class="title">Błąd wczytywania</div>'
    +'<div class="status err" style="display:block">'+esc(msg)+'</div>'
    +'<button class="btn btn-cancel" onclick="window.history.back()">← Wróć</button>'
  );
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Wczytaj dane z hash URL
window.addEventListener('load', function(){
  var hash = window.location.hash.slice(1);
  if(!hash){
    showError('Brak danych konfiguracyjnych w linku. Upewnij się że link jest kompletny.');
    return;
  }
  try{
    var json = decodeURIComponent(escape(atob(hash)));
    var cfg  = JSON.parse(json);
    if(!cfg || typeof cfg !== 'object') throw new Error('Nieprawidłowy format danych');
    showConfirm(cfg);
  }catch(e){
    showError('Nie można odczytać konfiguracji: '+e.message+'. Poproś o wygenerowanie nowego linku.');
  }
});
</script>
</body>
</html>
