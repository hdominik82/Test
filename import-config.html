<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>CEVA — Wczytaj konfigurację</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#021D49,#1D4289);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:#fff;border-radius:16px;padding:28px 22px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.icon{font-size:2.8em;text-align:center;margin-bottom:10px}
h1{font-size:1.2em;font-weight:800;color:#021D49;text-align:center;margin-bottom:6px}
.sub{font-size:.83em;color:#64748b;text-align:center;margin-bottom:20px;line-height:1.5}
.info{background:#f1f5f9;border-radius:10px;padding:12px;margin-bottom:16px;font-size:.82em}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #e2e8f0}
.row:last-child{border:none}
.lbl{color:#64748b}.val{font-weight:700;color:#021D49}
.btn{width:100%;padding:14px;border-radius:10px;border:none;font-family:inherit;font-size:.95em;font-weight:700;cursor:pointer;margin-bottom:8px}
.ok{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff}
.cancel{background:#f1f5f9;color:#64748b}
.msg{padding:12px;border-radius:8px;font-size:.85em;font-weight:600;margin-bottom:14px;text-align:center;line-height:1.5}
.msg-ok{background:#f0fdf4;color:#166534;border:2px solid #bbf7d0}
.msg-err{background:#fef2f2;color:#dc2626;border:2px solid #fecaca}
.msg-warn{background:#fffbeb;color:#92400e;border:2px solid #fde68a}
.lnk{display:block;padding:14px;border-radius:10px;text-decoration:none;font-weight:700;font-size:.9em;color:#fff;text-align:center;background:linear-gradient(135deg,#021D49,#1D4289);margin-bottom:8px}
</style>
</head>
<body>
<div class="box">
  <div class="icon" id="ico">⏳</div>
  <h1 id="title">Wczytywanie…</h1>
  <div class="sub" id="sub"></div>
  <div class="info" id="info" style="display:none"></div>
  <div class="msg" id="msg" style="display:none"></div>
  <button class="btn ok"     id="btnOk"     style="display:none" onclick="doSave()">✅ Załaduj konfigurację</button>
  <button class="btn cancel" id="btnCancel" style="display:none" onclick="history.back()">✖ Anuluj</button>
  <div id="links" style="display:none">
    <a href="mobile-index.html" class="lnk">📱 Otwórz aplikację CEVA</a>
  </div>
</div>

<script>
var KEY = 'ceva_cfg';
var _pending = null;

// ─── DEKODOWANIE ──────────────────────────────────────────────
// Android Chrome + TextDecoder — najczystsza metoda
function decodeData(str) {
  str = str.replace(/\s/g, ''); // usuń białe znaki (Teams może dodać)
  try {
    // Metoda główna: TextDecoder (Android Chrome obsługuje w 100%)
    var bytes = Uint8Array.from(atob(str), function(ch) { return ch.charCodeAt(0); });
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  } catch(e1) {}
  // Fallback: stara metoda
  try {
    return JSON.parse(decodeURIComponent(atob(str).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join('')));
  } catch(e2) {}
  return null;
}

// ─── ZAPIS ───────────────────────────────────────────────────
function saveToStorage(data) {
  localStorage.setItem(KEY, JSON.stringify(data));
  // Weryfikacja
  if (!localStorage.getItem(KEY)) throw new Error('localStorage niedostępny');
}

function readFromStorage() {
  try { return JSON.parse(localStorage.getItem(KEY)); } catch(e) { return null; }
}

// ─── HELPERS UI ──────────────────────────────────────────────
function show(id) { document.getElementById(id).style.display = 'block'; }
function hide(id) { document.getElementById(id).style.display = 'none'; }
function setMsg(text, type) {
  var el = document.getElementById('msg');
  el.className = 'msg msg-' + type;
  el.textContent = text;
  show('msg');
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

// ─── POBIERZ DANE Z URL ───────────────────────────────────────
function getDataFromUrl() {
  // ?d= — jedyna metoda, działa niezawodnie w Android Chrome
  var d = new URLSearchParams(location.search).get('d');
  if (d) return decodeData(d);
  // #hash — fallback dla starszych linków
  var h = location.hash.slice(1);
  if (h) return decodeData(h);
  return null;
}

// ─── POKAŻ POTWIERDZENIE ─────────────────────────────────────
function showConfirm(cfg) {
  _pending = cfg;
  var existing = readFromStorage();

  document.getElementById('ico').textContent   = '📥';
  document.getElementById('title').textContent = 'Nowy config dla tabletu';
  document.getElementById('sub').textContent   = 'Chcesz załadować konfigurację? Zostanie zapisana na tym urządzeniu.';

  var qCount = Object.values(cfg.gembaQuestions || {}).reduce(function(s,a){ return s + a.length; }, 0);
  var html = ''
    + '<div class="row"><span class="lbl">📍 Lokalizacja</span><span class="val">' + esc(cfg.location) + (cfg._v ? ' v'+cfg._v : '') + '</span></div>'
    + '<div class="row"><span class="lbl">📍 Strefy</span><span class="val">' + (cfg.zones||[]).length + '</span></div>'
    + '<div class="row"><span class="lbl">👤 Prowadzący</span><span class="val">' + (cfg.auditors||[]).length + '</span></div>'
    + '<div class="row"><span class="lbl">❓ Pytania GEMBA</span><span class="val">' + qCount + '</span></div>'
    + '<div class="row"><span class="lbl">📋 Instrukcje</span><span class="val">' + (cfg.instructions||[]).length + '</span></div>';

  if (existing) {
    html += '<div style="margin-top:8px;font-size:.78em;color:#92400e;background:#fffbeb;border-radius:6px;padding:6px">'
      + '⚠️ Nadpisze obecny config: ' + esc(existing.location||'?') + (existing._v ? ' v'+existing._v : '') + '</div>';
  }

  document.getElementById('info').innerHTML = html;
  show('info'); show('btnOk'); show('btnCancel');
}

// ─── ZAPISZ ──────────────────────────────────────────────────
function doSave() {
  if (!_pending) return;
  try {
    saveToStorage(_pending);
    document.getElementById('ico').textContent   = '✅';
    document.getElementById('title').textContent = 'Config zapisany!';
    document.getElementById('sub').textContent   = 'Konfiguracja dla ' + esc(_pending.location||'') + ' została zapisana.';
    hide('info'); hide('btnOk'); hide('btnCancel');
    setMsg('✅ Dane zapisane — otwórz aplikację poniżej.', 'ok');
    show('links');
  } catch(e) {
    setMsg('❌ Błąd zapisu: ' + e.message, 'err');
  }
}

// ─── START ───────────────────────────────────────────────────
window.addEventListener('load', function() {
  var cfg = getDataFromUrl();

  if (!cfg || !cfg.location) {
    document.getElementById('ico').textContent   = '❌';
    document.getElementById('title').textContent = 'Nieprawidłowy link';
    document.getElementById('sub').textContent   = 'Link jest nieprawidłowy lub został obcięty.';
    setMsg('Otwórz link bezpośrednio w Chrome — nie przez Teams lub email.', 'warn');
    return;
  }

  showConfirm(cfg);
});
</script>
</body>
</html>
